# Behat configuration for the 071-cli functional test suite. Modelled on
# wp-cli's own behat.yml: a single `default` profile, a FeatureContext that
# runs the 071 CLI and captures its STDOUT / STDERR / exit code, and the
# Gherkin feature files under tools/cli/features/. See tools/cli/README.md.
default:
  suites:
    default:
      paths:
        - '%paths.base%/tools/cli/features'
      contexts:
        - FeatureContext
  autoload:
    '': '%paths.base%/tools/cli/features/bootstrap'
