# Dedicated MySQL 8 database for the 071-cli Behat functional test suite.
#     This is a SEPARATE Docker Compose project from the repository root
#     docker-compose.yml: it uses its own project name (071-cli-test), its own
#     named volume, and publishes MySQL on host port 3307 -- so the developer's
#     own stack on 3306 and its `b2` database are never touched. The Behat
#     suite seeds the WordPress 0.71 schema into the `b2_test` database here and
#     resets it between scenarios.
#     Start : docker compose -p 071-cli-test -f tools/cli/tests/docker-compose.yml up -d
#     Stop  : docker compose -p 071-cli-test -f tools/cli/tests/docker-compose.yml down -v
services:
  # MySQL 8 -- same engine version as the repository root stack so the
  #     071-cli tool runs against an identical database server.
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: b2_test
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      # Host port 3307 -- distinct from the developer stack's 3306.
      - "3307:3306"
    healthcheck:
      # Behat waits on this health check before seeding the schema.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  # Named volume scoped to the 071-cli-test project; removed by `down -v`.
  db-test-data:
