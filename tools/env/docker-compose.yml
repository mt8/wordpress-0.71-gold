# Local development environment for WordPress 0.71-gold (PHP 8.3 + MySQL 8).
#     Start : docker compose -f tools/env/docker-compose.yml --project-directory . up -d --build
#     Browse: http://localhost:8080
#
#     This file lives in tools/env/ but its relative paths (`context: .`,
#     `dockerfile: tools/env/Dockerfile`, `./src`) are repository-root-relative.
#     Compose resolves them against the project directory, which defaults to
#     the first `-f` file's directory; pass `--project-directory .` from the
#     repository root (071-env does this automatically) so they resolve there.
#
#     The host ports, the PHP version and the MySQL database name /
#     credentials use Compose variable substitution with defaults
#     (`${VAR:-default}`), so a plain `docker compose up` is unchanged while
#     071-env can override them from `.071-env.json` by passing WP_PORT /
#     DB_PORT / PHP_VERSION / DB_NAME / DB_USER / DB_PASSWORD in the
#     environment. Compose appends port lists across `-f` files, so a layered
#     override file cannot change a port -- variable substitution is the
#     correct mechanism.
services:
  # Apache + PHP web server, built from tools/env/Dockerfile.
  web:
    build:
      # The build context is the repository root (the project directory);
      #     the Dockerfile path is repository-root-relative.
      context: .
      dockerfile: tools/env/Dockerfile
      # Forward the PHP version to the Dockerfile's PHP_VERSION build ARG.
      args:
        PHP_VERSION: "${PHP_VERSION:-8.3}"
    ports:
      - "${WP_PORT:-8080}:80"
    volumes:
      # Mount the WordPress source as the Apache document root.
      - ./src:/var/www/html
    depends_on:
      - db

  # MySQL 8 database. The database name and credentials match
  #     src/b2config.php; 071-env passes DB_NAME / DB_USER / DB_PASSWORD from
  #     the `wpConfig` object of .071-env.json, so one setting drives both the
  #     blog config and the container. A plain `docker compose up` without
  #     071-env falls back to the b2config-sample.php defaults.
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: "${DB_NAME:-b2}"
      MYSQL_USER: "${DB_USER:-user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-pass}"
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      # Named volume so database contents persist across container restarts.
      - db-data:/var/lib/mysql

volumes:
  db-data:
